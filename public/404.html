<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Página no encontrada — Centro Crecemos</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, rgba(123,31,162,0.06), #ffffff 45%, rgba(163,198,68,0.08));
      color: #222;
    }
    .card { max-width: 520px; width: 100%; text-align: center; }
    .code {
      font-size: 150px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(90deg, #7B1FA2, #A3C644);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      user-select: none;
    }
    h2 { font-size: 28px; font-weight: 700; color: #111827; margin-top: 8px; }
    @media (max-width: 480px) { .code { font-size: 110px; } h2 { font-size: 22px; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h2>Página no encontrada</h2>
  </main>
</body>
</html>
